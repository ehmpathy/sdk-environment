ignores:
  - depcheck
  - declapract
  - declapract-typescript-ehmpathy
  - '@commitlint/config-conventional'
  - serverless-prune-plugin
  - husky
  - if-env
  - "@src/*"
  - "@src/.*"
  # all rhachet packages (roles/brains churn as prepare:rhachet installs vary)
  - "rhachet*"
  - "@tsconfig/node20"
  - "@tsconfig/strictest"
  - "@biomejs/biome"
  - esbuild-register
  - "@swc/core"
  - "@swc/jest"
  - tsx
  - tsc-alias
  - yalc
  - sdk-environment
  - bun
ignorePatterns:
  # rhachet host-local runtime state (actor caches, plugin copies); gitignored,
  # never source, and its files import packages this repo does not use
  - .agent/.actors
  # rhachet links `.claude` into the enrolled actor dir, so depcheck reaches the same
  # host-local cache through it; the link is not source either
  - .claude
  # role dirs vendored from other repos import their own origin deps; only
  # this repo own role dir is source that depcheck should attribute
  - .agent/repo=*
  - "!.agent/repo=.this"